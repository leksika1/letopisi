name: letopisi
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: letopisi
      POSTGRES_USER: letopisi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letopisi}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "letopisi", "-d", "letopisi"]
      start_period: 30s
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://letopisi:letopisi@postgres:5432/letopisi}
      YC_FOLDER_ID: ${YC_FOLDER_ID:-}
      YC_API_KEY: ${YC_API_KEY:-}
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - documents:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -S
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3))['db']"
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  documents:
