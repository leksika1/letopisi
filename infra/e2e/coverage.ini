[run]
branch = True
parallel = True
relative_files = True
patch = subprocess
source =
    pipeline
    infra
source_pkgs =
    backend.app
    pipeline
    dictionaries.scripts
omit =
    */tests/*
    */e2e/*

[paths]
pipeline =
    pipeline
    */checkout/pipeline
    */test_*/pipeline
dictionaries =
    dictionaries/scripts
    */checkout/dictionaries/scripts
    */test_*/dictionaries/scripts
infra =
    infra
    */test_*/infra

[report]
include_namespace_packages = True
show_missing = False
